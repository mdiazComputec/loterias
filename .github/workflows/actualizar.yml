name: Actualizar resultados

on:
  schedule:
    # 12:30 a. m. y 7:00 a. m. hora de Colombia (los sorteos son en la noche)
    - cron: "30 5 * * *"
    - cron: "0 12 * * *"
  # Botón "Run workflow" para actualizar a mano desde GitHub
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Traer resultados nuevos y armar la página
        run: python scripts/actualizar.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "actualizador-loterias"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || (git commit -m "Resultados al $(TZ=America/Bogota date +%F)" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicar
        uses: actions/deploy-pages@v4
